<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Diwali — Festival of Lights Celebration</title>
  <meta name="description" content="Personalized Diwali blessings, fireworks, and crackers for you and your family.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Montserrat:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000002;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      user-select: none;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      cursor: crosshair;
    }

    /* Sound Pill */
    #soundPill {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 50;
      background: rgba(14, 8, 22, 0.85);
      border: 1px solid rgba(255, 215, 120, 0.45);
      color: #ffd777;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 180, 0, 0.2);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #soundPill:hover {
      background: rgba(35, 15, 52, 0.95);
      border-color: #ffd700;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.4);
      transform: translateY(-2px);
    }

    /* Landing Card — Keeps Surprise Secret! */
    #heroLayer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #heroLayer.vanished {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    .luxury-card {
      pointer-events: auto;
      max-width: 520px;
      width: 90%;
      padding: 44px 32px;
      background: radial-gradient(circle at 50% 0%, rgba(45, 15, 65, 0.65) 0%, rgba(8, 2, 14, 0.92) 100%);
      border: 1px solid rgba(255, 215, 130, 0.38);
      border-radius: 28px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.95),
                  0 0 90px rgba(255, 140, 0, 0.2),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
      text-align: center;
    }

    .sanskrit-verse {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      color: rgba(255, 215, 140, 0.85);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.3rem, 5.5vw, 4rem);
      font-weight: 900;
      letter-spacing: 4px;
      line-height: 1.15;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 0%, #fff2a3 25%, #ffd700 50%, #ff8c00 80%, #ff4500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 28px rgba(255, 180, 0, 0.5));
    }

    .card-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.15rem, 2.5vw, 1.55rem);
      color: #ffca80;
      margin-bottom: 20px;
      text-shadow: 0 0 18px rgba(255, 140, 0, 0.5);
    }

    .card-desc {
      font-size: 13.5px;
      line-height: 1.6;
      color: rgba(255, 235, 210, 0.85);
      max-width: 420px;
      margin: 0 auto 28px;
      font-weight: 300;
    }

    .input-box {
      position: relative;
      max-width: 380px;
      margin: 0 auto 20px;
    }
    .name-input {
      width: 100%;
      padding: 16px 24px;
      background: rgba(12, 4, 22, 0.75);
      border: 1.5px solid rgba(255, 215, 120, 0.4);
      border-radius: 50px;
      outline: none;
      color: #fff9e6;
      font-size: 16px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      text-align: center;
      letter-spacing: 2px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.75), 0 0 25px rgba(255, 160, 0, 0.15);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .name-input::placeholder {
      color: rgba(255, 215, 150, 0.4);
      font-weight: 400;
      letter-spacing: 1px;
    }
    .name-input:focus {
      border-color: #ffd700;
      background: rgba(24, 8, 38, 0.9);
      box-shadow: 0 0 35px rgba(255, 200, 0, 0.45), inset 0 2px 10px rgba(0, 0, 0, 0.85);
      transform: scale(1.02);
    }

    .ignite-btn {
      position: relative;
      padding: 16px 44px;
      border: none;
      border-radius: 50px;
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 2.5px;
      color: #120300;
      cursor: pointer;
      background: linear-gradient(135deg, #fff7c2 0%, #ffd700 35%, #ff9900 70%, #ff3b00 100%);
      box-shadow: 0 10px 35px rgba(255, 90, 0, 0.55),
                  0 0 60px rgba(255, 180, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
    }
    .ignite-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 16px 45px rgba(255, 90, 0, 0.7), 0 0 85px rgba(255, 215, 0, 0.6);
    }

    .error-shake {
      animation: shakeInput 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: #ff3344 !important;
      box-shadow: 0 0 30px rgba(255, 50, 70, 0.6) !important;
    }
    @keyframes shakeInput {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Celebration Controls Bar */
    #celebrateBar {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s ease;
    }
    #celebrateBar.active {
      opacity: 1;
      pointer-events: auto;
    }
    .action-pill {
      padding: 12px 32px;
      background: rgba(16, 8, 24, 0.88);
      border: 1px solid rgba(255, 215, 100, 0.55);
      border-radius: 50px;
      color: #ffd777;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 170, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .action-pill:hover {
      background: rgba(35, 15, 50, 0.98);
      border-color: #ffd700;
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 45px rgba(255, 215, 0, 0.55);
    }
    .hint-label {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(255, 220, 160, 0.85);
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <button id="soundPill" title="Toggle realistic sound effects">
    <span id="soundIcon">🔊</span>
    <span id="soundTxt">SOUND ON</span>
  </button>

  <div id="heroLayer">
    <div class="luxury-card">
      <div class="sanskrit-verse">॥ शुभम् करोति कल्याणम् ॥</div>
      <h1 class="card-title">DEEPAVALI</h1>
      <div class="card-subtitle">A Special Festival of Lights Celebration</div>
      <p class="card-desc">Enter your name to ignite the grand ceremonial rocket and unlock your personal Diwali wishes and celestial fireworks celebration.</p>
      
      <div class="input-box">
        <input 
          type="text" 
          id="nameField" 
          class="name-input" 
          placeholder="ENTER YOUR NAME" 
          maxlength="20" 
          autocomplete="off" 
          spellcheck="false"
        >
      </div>

      <button id="igniteBtn" class="ignite-btn">🚀 IGNITE CELEBRATION 🪔</button>
    </div>
  </div>

  <div id="celebrateBar">
    <button id="relaunchBtn" class="action-pill">↺ CELEBRATE ANOTHER NAME</button>
    <div class="hint-label">✨ Tap or drag in the sky to launch fireworks &amp; draw sparklers ✨</div>
  </div>

  <script>
  'use strict';

  /* ==========================================================================
     1. WEB AUDIO SYNTHESIZER
     ========================================================================== */
  class SoundSynthesizer {
    constructor() {
      this.ctx = null;
      this.enabled = true;
      this.ready = false;
    }

    init() {
      if (this.ready) return;
      const AudioClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioClass) return;
      this.ctx = new AudioClass();
      this.ready = true;
    }

    toggle() {
      this.enabled = !this.enabled;
      if (this.enabled && this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      return this.enabled;
    }

    playRocketLaunch(duration = 1.1) {
      if (!this.enabled || !this.ctx) return;
      const now = this.ctx.currentTime;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.exponentialRampToValueAtTime(1750, now + duration * 0.95);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.12, now + duration * 0.35);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2600, now);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now);
      osc.stop(now + duration);
      this.playHiss(duration, 0.13);
    }

    playHiss(duration, vol = 0.1) {
      if (!this.enabled || !this.ctx) return;
      const bufferSize = Math.floor(this.ctx.sampleRate * duration);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const bandpass = this.ctx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.setValueAtTime(950, this.ctx.currentTime);
      bandpass.Q.setValueAtTime(2.5, this.ctx.currentTime);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

      noise.connect(bandpass);
      bandpass.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start();
    }

    playExplosion(intensity = 1.0) {
      if (!this.enabled || !this.ctx) return;
      const now = this.ctx.currentTime;

      const osc = this.ctx.createOscillator();
      const oscGain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140 * intensity, now);
      osc.frequency.exponentialRampToValueAtTime(28, now + 0.9);

      oscGain.gain.setValueAtTime(0.85 * intensity, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

      osc.connect(oscGain);
      oscGain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 1.2);

      const bufferSize = Math.floor(this.ctx.sampleRate * 1.4);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1100, now);
      filter.frequency.linearRampToValueAtTime(140, now + 1.4);

      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.65 * intensity, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(this.ctx.destination);
      noise.start(now);
    }

    playCrackle() {
      if (!this.enabled || !this.ctx) return;
      const count = 4 + Math.floor(Math.random() * 5);
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          if (!this.ctx || !this.enabled) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1800 + Math.random() * 2600, now);
          gain.gain.setValueAtTime(0.02, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.03);
        }, Math.random() * 220);
      }
    }
  }

  const sound = new SoundSynthesizer();

  const soundPill = document.getElementById('soundPill');
  const soundIcon = document.getElementById('soundIcon');
  const soundTxt = document.getElementById('soundTxt');

  soundPill.addEventListener('click', () => {
    sound.init();
    const active = sound.toggle();
    soundIcon.textContent = active ? '🔊' : '🔇';
    soundTxt.textContent = active ? 'SOUND ON' : 'SOUND OFF';
  });


  /* ==========================================================================
     2. CANVAS SETUP & ATMOSPHERIC NIGHT SKY
     ========================================================================== */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class NightSky {
    constructor() {
      this.stars = [];
      this.init();
    }
    init() {
      this.stars = [];
      for (let i = 0; i < 280; i++) {
        this.stars.push({
          x: Math.random() * W,
          y: Math.random() * H * 0.85,
          r: Math.random() * 1.3 + 0.3,
          baseAlpha: Math.random() * 0.65 + 0.2,
          speed: Math.random() * 2.5 + 1.0,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
    draw(t) {
      for (let i = 0; i < this.stars.length; i++) {
        const s = this.stars[i];
        const alpha = s.baseAlpha * (0.6 + 0.4 * Math.sin(t * s.speed + s.phase));
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  const sky = new NightSky();


  /* ==========================================================================
     3. HIGH-READABILITY SPARKLER WISHES FOR THEM & THEIR FAMILY!
     Displays:
       Line 1: ✨ HAPPY DIWALI ✨
       Line 2: <NAME> & FAMILY
       Line 3: 🪔 JOY, PEACE & PROSPERITY 🪔
     Smooth, perfectly readable sparkler firework lights!
     ========================================================================== */
  class SkyFireworkLightLettering {
    constructor() {
      this.active = false;
      this.burners = [];
      this.sparks = [];
    }

    trigger(name) {
      this.active = true;
      this.burners = [];
      this.sparks = [];

      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      offCanvas.width = W;
      offCanvas.height = H;

      const isMobile = W < 600;
      let cleanName = name.toUpperCase().trim();
      
      // Format dedication: e.g. "NK ABHIRAJ & FAMILY"
      let familyText = cleanName.includes('FAMILY') ? cleanName : `${cleanName} & FAMILY`;
      const nameLen = Math.max(1, familyText.length);

      // Auto-scale font sizes
      const maxTextW = Math.min(W * 0.88, 940);
      const targetSize = Math.floor(Math.min(
        isMobile ? 38 : 64,
        maxTextW / (nameLen * 0.66)
      ));

      const line1Size = Math.floor(Math.min(isMobile ? 22 : 36, targetSize * 0.7));
      const line2Size = Math.max(isMobile ? 20 : 30, targetSize);
      const line3Size = Math.floor(Math.min(isMobile ? 15 : 24, targetSize * 0.45));

      const line1Y = Math.floor(H * 0.20);
      const line2Y = Math.floor(H * 0.32);
      const line3Y = Math.floor(H * 0.42);

      // Render line 1: ✨ HAPPY DIWALI ✨
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      if ('letterSpacing' in offCtx) offCtx.letterSpacing = isMobile ? '3px' : '6px';
      offCtx.font = `800 ${line1Size}px 'Montserrat', sans-serif`;
      offCtx.fillStyle = '#ffffff';
      offCtx.fillText('✨ HAPPY DIWALI ✨', W / 2, line1Y);

      // Render line 2: <NAME> & FAMILY
      if ('letterSpacing' in offCtx) offCtx.letterSpacing = isMobile ? '4px' : '7px';
      offCtx.font = `800 ${line2Size}px 'Montserrat', sans-serif`;
      offCtx.fillText(familyText, W / 2, line2Y);

      // Render line 3: 🪔 JOY, PEACE & PROSPERITY 🪔
      if ('letterSpacing' in offCtx) offCtx.letterSpacing = isMobile ? '2px' : '5px';
      offCtx.font = `700 ${line3Size}px 'Montserrat', sans-serif`;
      offCtx.fillText('🪔 JOY, PEACE & PROSPERITY 🪔', W / 2, line3Y);

      const imgData = offCtx.getImageData(0, 0, W, H).data;

      // Smooth step sampling: 5px for continuous, elegant letter curves
      const step = isMobile ? 5 : 5;
      for (let y = 0; y < H; y += step) {
        for (let x = 0; x < W; x += step) {
          const idx = (y * W + x) * 4;
          if (imgData[idx] > 140) {
            let col = '#ffd700'; // Gold for Happy Diwali
            if (y > (line1Y + line2Y) / 2 && y <= (line2Y + line3Y) / 2) {
              col = '#ffffff'; // White-hot diamond for Name & Family
            } else if (y > (line2Y + line3Y) / 2) {
              col = '#ffca80'; // Warm peach/gold for blessings
            }

            this.burners.push({
              x: x,
              y: y,
              baseColor: col,
              phase: Math.random() * Math.PI * 2,
              speed: Math.random() * 0.25 + 0.15,
              spikeLen: Math.random() * 3 + 3.5
            });
          }
        }
      }
    }

    clear() {
      this.active = false;
      this.burners = [];
      this.sparks = [];
    }

    updateAndDraw(now) {
      if (!this.active) return;

      // Delicate dripping embers
      if (this.sparks.length < 160) {
        for (let i = 0; i < 3; i++) {
          if (this.burners.length === 0) break;
          const b = this.burners[Math.floor(Math.random() * this.burners.length)];
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 2.4 + 0.5;
          this.sparks.push({
            x: b.x,
            y: b.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed + 0.35,
            color: Math.random() > 0.3 ? '#ffd700' : '#ffffff',
            size: Math.random() * 1.5 + 0.8,
            alpha: 1.0,
            decay: 0.024 + Math.random() * 0.02
          });
        }
      }

      if (Math.random() < 0.12) sound.playCrackle();

      // 1. Draw Sparks
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      this.sparks = this.sparks.filter(s => s.alpha > 0.01);
      for (let i = 0; i < this.sparks.length; i++) {
        const s = this.sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vx *= 0.96;
        s.vy *= 0.96;
        s.vy += 0.09;
        s.alpha -= s.decay;

        ctx.fillStyle = s.color;
        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Draw Twinkling Sparkler Light Nodes
      for (let i = 0; i < this.burners.length; i++) {
        const b = this.burners[i];
        b.phase += b.speed;
        const shine = 0.5 + 0.5 * Math.sin(b.phase);

        ctx.fillStyle = b.baseColor;
        ctx.globalAlpha = 0.65 + 0.35 * shine;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.0 + shine * 1.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.85 + 0.15 * shine;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 1.1, 0, Math.PI * 2);
        ctx.fill();

        if (shine > 0.84) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 0.85;
          ctx.globalAlpha = (shine - 0.84) * 3.5;
          ctx.beginPath();
          ctx.moveTo(b.x - b.spikeLen, b.y);
          ctx.lineTo(b.x + b.spikeLen, b.y);
          ctx.moveTo(b.x, b.y - b.spikeLen);
          ctx.lineTo(b.x, b.y + b.spikeLen);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  }

  const skyWriting = new SkyFireworkLightLettering();


  /* ==========================================================================
     4. ANARS & CHAKRAS
     ========================================================================== */
  let sparks = [];
  let smokePuffs = [];

  function addSpark(x, y, vx, vy, color, size, decay, drag = 0.98, gravity = 0.05) {
    sparks.push({
      x, y, vx, vy, color, size,
      alpha: 1.0,
      decay: decay || (0.015 + Math.random() * 0.02),
      drag, gravity
    });
  }

  function addSmoke(x, y, vx, vy, size) {
    smokePuffs.push({
      x, y, vx, vy, size,
      maxSize: size * (2.4 + Math.random() * 1.6),
      alpha: 0.3 + Math.random() * 0.2,
      decay: 0.005 + Math.random() * 0.006,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.02
    });
  }

  class AnarFountain {
    constructor(x, y, scale = 1.0) {
      this.x = x;
      this.y = y;
      this.scale = scale;
      this.height = 42 * scale;
      this.baseWidth = 34 * scale;
    }

    update() {
      const topY = this.y - this.height;
      const count = Math.floor(Math.random() * 4 + 3);

      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.55;
        const speed = (Math.random() * 11 + 9) * this.scale;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        const colors = ['#ffffff', '#fff7c2', '#ffd700', '#ff9900', '#ff4400'];
        const col = colors[Math.floor(Math.random() * colors.length)];
        addSpark(this.x + (Math.random() - 0.5) * 4, topY, vx, vy, col, Math.random() * 2.2 + 1.2, 0.022, 0.97, 0.14);
      }

      if (Math.random() < 0.2) {
        addSmoke(this.x + (Math.random() - 0.5) * 6, topY - 10, (Math.random() - 0.5) * 0.8, -Math.random() * 1.2 - 0.4, 6 + Math.random() * 4);
      }
    }

    draw() {
      const s = this.scale;
      const x = this.x;
      const y = this.y;
      const h = this.height;
      const w = this.baseWidth;

      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.ellipse(x, y + 2, w * 0.7, 5 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      const coneGrad = ctx.createLinearGradient(x - w / 2, y, x + w / 2, y - h);
      coneGrad.addColorStop(0, '#9e1a00');
      coneGrad.addColorStop(0.35, '#d44900');
      coneGrad.addColorStop(0.7, '#ffd700');
      coneGrad.addColorStop(1, '#ff8c00');

      ctx.beginPath();
      ctx.moveTo(x - w / 2, y);
      ctx.lineTo(x + w / 2, y);
      ctx.lineTo(x + 4 * s, y - h);
      ctx.lineTo(x - 4 * s, y - h);
      ctx.closePath();
      ctx.fillStyle = coneGrad;
      ctx.fill();

      ctx.globalCompositeOperation = 'lighter';
      const nozzleGlow = ctx.createRadialGradient(x, y - h, 2, x, y - h, 38 * s);
      nozzleGlow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      nozzleGlow.addColorStop(0.3, 'rgba(255, 220, 100, 0.8)');
      nozzleGlow.addColorStop(0.7, 'rgba(255, 120, 0, 0.25)');
      nozzleGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = nozzleGlow;
      ctx.beginPath();
      ctx.arc(x, y - h, 38 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  class GroundChakra {
    constructor(x, y, scale = 1.0) {
      this.x = x;
      this.y = y;
      this.scale = scale;
      this.angle = 0;
    }

    update() {
      this.angle += 0.42;
      for (let i = 0; i < 4; i++) {
        const jetAngle = this.angle + (i * Math.PI / 2);
        const radius = 16 * this.scale;
        const px = this.x + Math.cos(jetAngle) * radius;
        const py = this.y + Math.sin(jetAngle) * radius * 0.45;

        const tangentAngle = jetAngle + Math.PI / 2;
        const speed = (Math.random() * 8 + 6) * this.scale;
        const vx = Math.cos(tangentAngle) * speed + (Math.random() - 0.5) * 2;
        const vy = Math.sin(tangentAngle) * speed * 0.45 - (Math.random() * 2);

        const colors = ['#ffffff', '#ffd700', '#00ffcc', '#ff3366', '#ffaa00'];
        const col = colors[Math.floor(Math.random() * colors.length)];
        addSpark(px, py, vx, vy, col, Math.random() * 2.2 + 1.2, 0.035, 0.96, 0.06);
      }
    }

    draw() {
      const s = this.scale;
      const x = this.x;
      const y = this.y;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const wheelGlow = ctx.createRadialGradient(x, y, 4, x, y, 40 * s);
      wheelGlow.addColorStop(0, 'rgba(255, 230, 150, 0.7)');
      wheelGlow.addColorStop(0.4, 'rgba(255, 140, 20, 0.35)');
      wheelGlow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = wheelGlow;
      ctx.beginPath();
      ctx.ellipse(x, y, 40 * s, 18 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.translate(x, y);
      ctx.scale(1, 0.45);
      ctx.rotate(this.angle);

      ctx.fillStyle = '#ff4400';
      ctx.beginPath();
      ctx.arc(0, 0, 18 * s, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3 * s;
      for (let j = 0; j < 4; j++) {
        ctx.beginPath();
        ctx.arc(0, 0, 14 * s, j * Math.PI / 2, (j + 0.4) * Math.PI / 2);
        ctx.stroke();
      }

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, 4 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ==========================================================================
     5. PHOTOREALISTIC TRADITIONAL CLAY DIYAS
     ========================================================================== */
  class PhotorealisticDiya {
    constructor(x, y, scale = 1.0) {
      this.x = x;
      this.y = y;
      this.scale = scale;
      this.flicker = Math.random() * 100;
    }

    draw() {
      this.flicker += 0.09;
      const s = this.scale;
      const x = this.x;
      const y = this.y;

      const turbulence = Math.sin(this.flicker * 3.4) * Math.cos(this.flicker * 2.1);
      const flameH = (32 + turbulence * 4) * s;
      const flameW = (12 + Math.sin(this.flicker * 4.8) * 2.2) * s;
      const tilt = Math.sin(this.flicker * 2.6) * 2.5 * s;

      const groundGlow = ctx.createRadialGradient(x, y + 8 * s, 4 * s, x, y + 8 * s, 90 * s);
      groundGlow.addColorStop(0, 'rgba(255, 140, 20, 0.4)');
      groundGlow.addColorStop(0.5, 'rgba(255, 80, 0, 0.14)');
      groundGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = groundGlow;
      ctx.beginPath();
      ctx.ellipse(x, y + 8 * s, 90 * s, 26 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.ellipse(x, y + 14 * s, 26 * s, 5 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      const clayGrad = ctx.createLinearGradient(x - 28 * s, y, x + 28 * s, y + 14 * s);
      clayGrad.addColorStop(0, '#531b05');
      clayGrad.addColorStop(0.25, '#99370b');
      clayGrad.addColorStop(0.5, '#ce5418');
      clayGrad.addColorStop(0.75, '#99370b');
      clayGrad.addColorStop(1, '#3c1202');

      ctx.beginPath();
      ctx.moveTo(x - 28 * s, y);
      ctx.bezierCurveTo(x - 26 * s, y + 14 * s, x + 26 * s, y + 14 * s, x + 28 * s, y);
      ctx.bezierCurveTo(x + 20 * s, y - 2 * s, x - 20 * s, y - 2 * s, x - 28 * s, y);
      ctx.fillStyle = clayGrad;
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 190, 110, 0.5)';
      ctx.lineWidth = 1.5 * s;
      ctx.stroke();

      const oilGrad = ctx.createRadialGradient(x, y - 1 * s, 2 * s, x, y - 1 * s, 22 * s);
      oilGrad.addColorStop(0, '#ffc759');
      oilGrad.addColorStop(0.6, '#b86600');
      oilGrad.addColorStop(1, '#482000');
      ctx.beginPath();
      ctx.ellipse(x, y, 22 * s, 5 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#151515';
      ctx.lineWidth = 2 * s;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + tilt * 0.35, y - 6 * s);
      ctx.stroke();

      ctx.globalCompositeOperation = 'lighter';

      ctx.beginPath();
      ctx.moveTo(x - flameW, y - 5 * s);
      ctx.quadraticCurveTo(x - flameW * 1.1, y - flameH * 0.55, x + tilt, y - flameH - 5 * s);
      ctx.quadraticCurveTo(x + flameW * 1.1, y - flameH * 0.55, x + flameW, y - 5 * s);
      ctx.closePath();
      const outerGrad = ctx.createLinearGradient(x, y - 5 * s, x, y - flameH - 5 * s);
      outerGrad.addColorStop(0, 'rgba(255, 60, 0, 0.85)');
      outerGrad.addColorStop(0.5, 'rgba(255, 140, 0, 0.8)');
      outerGrad.addColorStop(1, 'rgba(255, 220, 100, 0)');
      ctx.fillStyle = outerGrad;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x - flameW * 0.55, y - 5 * s);
      ctx.quadraticCurveTo(x - flameW * 0.6, y - flameH * 0.6, x + tilt * 0.7, y - flameH * 0.85 - 5 * s);
      ctx.quadraticCurveTo(x + flameW * 0.6, y - flameH * 0.6, x + flameW * 0.55, y - 5 * s);
      ctx.closePath();
      ctx.fillStyle = '#ffdd33';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x - flameW * 0.25, y - 5 * s);
      ctx.quadraticCurveTo(x - flameW * 0.28, y - flameH * 0.4, x + tilt * 0.4, y - flameH * 0.5 - 5 * s);
      ctx.quadraticCurveTo(x + flameW * 0.28, y - flameH * 0.4, x + flameW * 0.25, y - 5 * s);
      ctx.closePath();
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.restore();
    }
  }

  /* ==========================================================================
     6. AERIAL ROCKETS & MULTI-BREAK SHELL EXPLOSIONS
     ========================================================================== */
  class DirectionalRocket {
    constructor(startX, startY, targetX, targetY, onDetonate, speedMultiplier = 1.0) {
      this.x = startX;
      this.y = startY;
      this.targetX = targetX;
      this.targetY = targetY;
      this.onDetonate = onDetonate;

      const dx = targetX - startX;
      const dy = targetY - startY;
      const dist = Math.hypot(dx, dy);

      this.vx = (dx / dist) * (18 + Math.random() * 5) * speedMultiplier;
      this.vy = (dy / dist) * (24 + Math.random() * 6) * speedMultiplier;
      this.thrust = 0.38 * speedMultiplier;
      this.dead = false;
      this.trail = [];
      this.curve = (Math.random() - 0.5) * 0.25;
    }

    update() {
      if (this.dead) return;

      this.vx += this.curve;
      this.vy -= this.thrust;
      this.x += this.vx;
      this.y += this.vy;

      for (let i = 0; i < 3; i++) {
        const spread = (Math.random() - 0.5) * 3;
        const sparkVx = -this.vx * 0.2 + (Math.random() - 0.5) * 2;
        const sparkVy = -this.vy * 0.2 + (Math.random() - 0.5) * 2;
        addSpark(this.x + spread, this.y + spread, sparkVx, sparkVy, Math.random() > 0.3 ? '#ffd700' : '#ffffff', Math.random() * 2 + 1, 0.04, 0.95, 0.08);
      }

      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 18) this.trail.shift();

      if (this.y <= this.targetY || this.vy > -1.2) {
        this.dead = true;
        this.onDetonate(this.x, this.y);
      }
    }

    draw() {
      if (this.dead) return;

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 180, 50, 0.65)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < this.trail.length; i++) {
        const p = this.trail[i];
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();

      ctx.translate(this.x, this.y);
      const angle = Math.atan2(this.vy, this.vx) + Math.PI / 2;
      ctx.rotate(angle);

      ctx.fillStyle = '#ff2222';
      ctx.beginPath();
      ctx.moveTo(0, -16);
      ctx.lineTo(-4, -5);
      ctx.lineTo(4, -5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffd700';
      ctx.fillRect(-4, -5, 8, 16);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(0, 11, 3, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  class FireworkBurstParticle {
    constructor(x, y, vx, vy, color, type = 'chrysanthemum') {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.color = color;
      this.type = type;
      this.alpha = 1.0;
      this.trail = [];
      this.decay = (type === 'willow') ? (0.007 + Math.random() * 0.005) : (0.014 + Math.random() * 0.01);
      this.gravity = (type === 'willow') ? 0.085 : 0.065;
      this.drag = (type === 'willow') ? 0.965 : 0.955;
      this.size = Math.random() * 2.2 + 1.2;
    }

    update() {
      this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
      if (this.trail.length > (this.type === 'willow' ? 14 : 7)) this.trail.shift();

      this.vx *= this.drag;
      this.vy *= this.drag;
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.alpha -= this.decay;
    }

    draw() {
      if (this.alpha <= 0) return;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      ctx.lineWidth = this.size;
      for (let i = 0; i < this.trail.length - 1; i++) {
        const p1 = this.trail[i];
        const p2 = this.trail[i + 1];
        const segAlpha = (p1.alpha * (i / this.trail.length)).toFixed(2);
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = segAlpha;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  let bursts = [];

  function createRealisticExplosion(x, y, palette, count = 160, type = 'chrysanthemum') {
    sound.playExplosion(1.0);
    sound.playCrackle();

    const colors = palette || ['#ffd700', '#ff9900', '#ffffff', '#ff3300', '#00eeff'];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (Math.random() * 0.85 + 0.15) * (type === 'willow' ? 15 : 17);
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      const col = colors[Math.floor(Math.random() * colors.length)];
      bursts.push(new FireworkBurstParticle(x, y, vx, vy, col, type));
    }

    for (let i = 0; i < 6; i++) {
      addSmoke(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 1.5, 12 + Math.random() * 10);
    }
  }

  /* ==========================================================================
     8. MASTER RENDERING LOOP
     ========================================================================== */
  function render(now) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0, 0, 2, 0.26)';
    ctx.fillRect(0, 0, W, H);

    // 1. Stars
    sky.draw(now * 0.001);

    // 2. Smoke
    smokePuffs = smokePuffs.filter(s => s.alpha > 0.01);
    for (let i = 0; i < smokePuffs.length; i++) {
      const s = smokePuffs[i];
      s.x += s.vx;
      s.y += s.vy;
      s.size += (s.maxSize - s.size) * 0.04;
      s.alpha -= s.decay;
      s.rotation += s.rotSpeed;

      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rotation);
      ctx.fillStyle = `rgba(130, 110, 150, ${s.alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(0, 0, s.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 3. Rockets
    activeRockets = activeRockets.filter(r => !r.dead);
    for (let i = 0; i < activeRockets.length; i++) {
      activeRockets[i].update();
      activeRockets[i].draw();
    }

    // 4. Firework Bursts
    bursts = bursts.filter(b => b.alpha > 0.01);
    for (let i = 0; i < bursts.length; i++) {
      bursts[i].update();
      bursts[i].draw();
    }

    // 5. Sparks & Embers
    sparks = sparks.filter(sp => sp.alpha > 0.01);
    for (let i = 0; i < sparks.length; i++) {
      const sp = sparks[i];
      sp.vx *= sp.drag;
      sp.vy *= sp.drag;
      sp.vy += sp.gravity;
      sp.x += sp.vx;
      sp.y += sp.vy;
      sp.alpha -= sp.decay;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = sp.color;
      ctx.globalAlpha = Math.max(0, sp.alpha);
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 6. Real Sky Firework Sparkler Light Calligraphy
    skyWriting.updateAndDraw(now);

    // 7. Ground Crackers (Anars & Chakras)
    for (let i = 0; i < anars.length; i++) {
      anars[i].update();
      anars[i].draw();
    }
    for (let i = 0; i < chakras.length; i++) {
      chakras[i].update();
      chakras[i].draw();
    }

    // 8. Traditional Clay Diyas
    for (let i = 0; i < diyas.length; i++) {
      diyas[i].draw();
    }

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

  </script>
</body>
</html>
