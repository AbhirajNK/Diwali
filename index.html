<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deepavali — The Grand Festival of Lights</title>
  <meta name="description" content="An ultra-realistic Diwali firework and sparkler experience.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020106;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      user-select: none;
    }

    /* Master Canvas fills entire screen */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      cursor: crosshair;
    }

    /* Sound Control Pill */
    #soundPill {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 50;
      background: rgba(18, 10, 28, 0.75);
      border: 1px solid rgba(255, 215, 120, 0.4);
      color: #ffd777;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 180, 0, 0.15);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #soundPill:hover {
      background: rgba(35, 18, 55, 0.9);
      border-color: #ffd700;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.35);
      transform: translateY(-2px);
    }

    /* Modern Luxury Hero Interface */
    #heroLayer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #heroLayer.vanished {
      opacity: 0;
      transform: scale(1.06);
      pointer-events: none;
    }

    .luxury-card {
      pointer-events: auto;
      max-width: 560px;
      width: 90%;
      padding: 50px 38px;
      background: radial-gradient(circle at 50% 0%, rgba(45, 18, 65, 0.5) 0%, rgba(10, 3, 16, 0.82) 100%);
      border: 1px solid rgba(255, 215, 130, 0.32);
      border-radius: 28px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9),
                  0 0 90px rgba(255, 140, 0, 0.14),
                  inset 0 1px 0 rgba(255, 255, 255, 0.18);
      text-align: center;
      position: relative;
    }

    .sanskrit-verse {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      color: rgba(255, 215, 140, 0.8);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.3rem, 5.5vw, 4rem);
      font-weight: 900;
      letter-spacing: 4px;
      line-height: 1.15;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 0%, #fff2a3 25%, #ffd700 50%, #ff8c00 80%, #ff4500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 28px rgba(255, 180, 0, 0.45));
    }

    .card-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.15rem, 2.5vw, 1.6rem);
      color: #ffca80;
      margin-bottom: 22px;
      text-shadow: 0 0 18px rgba(255, 140, 0, 0.5);
    }

    .card-desc {
      font-size: 14px;
      line-height: 1.65;
      color: rgba(255, 235, 210, 0.78);
      max-width: 440px;
      margin: 0 auto 30px;
      font-weight: 300;
    }

    /* Luxurious Input */
    .input-box {
      position: relative;
      max-width: 380px;
      margin: 0 auto 22px;
    }
    .name-input {
      width: 100%;
      padding: 16px 26px;
      background: rgba(12, 5, 22, 0.65);
      border: 1.5px solid rgba(255, 215, 120, 0.35);
      border-radius: 50px;
      outline: none;
      color: #fff9e6;
      font-size: 16px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      text-align: center;
      letter-spacing: 2px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 160, 0, 0.12);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .name-input::placeholder {
      color: rgba(255, 215, 150, 0.35);
      font-weight: 400;
      letter-spacing: 1px;
    }
    .name-input:focus {
      border-color: #ffd700;
      background: rgba(22, 10, 36, 0.85);
      box-shadow: 0 0 35px rgba(255, 200, 0, 0.4), inset 0 2px 10px rgba(0, 0, 0, 0.8);
      transform: scale(1.02);
    }

    /* Golden Ignite Button */
    .ignite-btn {
      position: relative;
      padding: 16px 44px;
      border: none;
      border-radius: 50px;
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 2.5px;
      color: #120300;
      cursor: pointer;
      background: linear-gradient(135deg, #fff7c2 0%, #ffd700 35%, #ff9900 70%, #ff3b00 100%);
      box-shadow: 0 10px 35px rgba(255, 90, 0, 0.5),
                  0 0 60px rgba(255, 180, 0, 0.35),
                  inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
    }
    .ignite-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.75) 50%, transparent 60%);
      transform: rotate(25deg) translateY(-100%);
      animation: btnShimmer 3.5s infinite;
    }
    @keyframes btnShimmer {
      0%, 75% { transform: rotate(25deg) translateY(-100%); }
      100% { transform: rotate(25deg) translateY(100%); }
    }
    .ignite-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 16px 45px rgba(255, 90, 0, 0.65), 0 0 80px rgba(255, 215, 0, 0.55);
    }
    .ignite-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .error-shake {
      animation: shakeInput 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: #ff3344 !important;
      box-shadow: 0 0 30px rgba(255, 50, 70, 0.6) !important;
    }
    @keyframes shakeInput {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Live Interaction Bar */
    #celebrateBar {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s ease;
    }
    #celebrateBar.active {
      opacity: 1;
      pointer-events: auto;
    }
    .action-pill {
      padding: 12px 32px;
      background: rgba(18, 8, 28, 0.78);
      border: 1px solid rgba(255, 215, 100, 0.5);
      border-radius: 50px;
      color: #ffd777;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 170, 0, 0.25);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .action-pill:hover {
      background: rgba(35, 15, 50, 0.95);
      border-color: #ffd700;
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 45px rgba(255, 215, 0, 0.5);
    }
    .hint-label {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(255, 220, 160, 0.7);
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- Master Visual Rendering Engine -->
  <canvas id="canvas"></canvas>

  <!-- Sound Toggle -->
  <button id="soundPill" title="Toggle realistic sound effects">
    <span id="soundIcon">🔊</span>
    <span id="soundTxt">SOUND ON</span>
  </button>

  <!-- Hero Landing Interface -->
  <div id="heroLayer">
    <div class="luxury-card">
      <div class="sanskrit-verse">॥ शुभम् करोति कल्याणम् ॥</div>
      <h1 class="card-title">DEEPAVALI</h1>
      <div class="card-subtitle">The Grand Festival of Lights</div>
      <p class="card-desc">Enter your name to launch the ceremonial rocket and ignite your personalized sparkler fireworks celebration across the night sky.</p>
      
      <div class="input-box">
        <input 
          type="text" 
          id="nameField" 
          class="name-input" 
          placeholder="ENTER YOUR NAME" 
          maxlength="20" 
          autocomplete="off" 
          spellcheck="false"
        >
      </div>

      <button id="igniteBtn" class="ignite-btn">🚀 IGNITE CELEBRATION 🪔</button>
    </div>
  </div>

  <!-- In-Celebration Controls -->
  <div id="celebrateBar">
    <button id="relaunchBtn" class="action-pill">↺ CELEBRATE ANOTHER NAME</button>
    <div class="hint-label">✨ Tap or drag anywhere in the sky to launch fireworks &amp; draw sparklers ✨</div>
  </div>

  <script>
  'use strict';

  /* ==========================================================================
     1. PHYSICAL WEB AUDIO SYNTHESIZER (Real Booms, Whistles, Crackles)
     ========================================================================== */
  class SoundSynthesizer {
    constructor() {
      this.ctx = null;
      this.enabled = true;
      this.ready = false;
    }

    init() {
      if (this.ready) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      this.ctx = new AudioContextClass();
      this.ready = true;
    }

    toggle() {
      this.enabled = !this.enabled;
      if (this.enabled && this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      return this.enabled;
    }

    // Rocket Ascent Whistling Scream
    playRocketLaunch(duration = 2.0) {
      if (!this.enabled || !this.ctx) return;
      const now = this.ctx.currentTime;

      // Whistle tone rising in frequency
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.exponentialRampToValueAtTime(1600, now + duration * 0.95);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.14, now + duration * 0.35);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2400, now);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now);
      osc.stop(now + duration);

      // Rocket Thrust Exhaust Hiss
      this.playHissNoise(duration, 0.16);
    }

    playHissNoise(duration, vol = 0.1) {
      if (!this.enabled || !this.ctx) return;
      const bufferSize = Math.floor(this.ctx.sampleRate * duration);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }

      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const bandpass = this.ctx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.setValueAtTime(900, this.ctx.currentTime);
      bandpass.Q.setValueAtTime(2.5, this.ctx.currentTime);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

      noise.connect(bandpass);
      bandpass.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start();
    }

    // Heavy Sub-Bass Explosion Thunder
    playExplosion(intensity = 1.0) {
      if (!this.enabled || !this.ctx) return;
      const now = this.ctx.currentTime;

      // Sub-bass thud (sine dropping from 150Hz to 30Hz)
      const osc = this.ctx.createOscillator();
      const oscGain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140 * intensity, now);
      osc.frequency.exponentialRampToValueAtTime(28, now + 0.9);

      oscGain.gain.setValueAtTime(0.85 * intensity, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

      osc.connect(oscGain);
      oscGain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 1.2);

      // High-pressure blast noise
      const bufferSize = Math.floor(this.ctx.sampleRate * 1.4);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }

      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, now);
      filter.frequency.linearRampToValueAtTime(150, now + 1.4);

      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.65 * intensity, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(this.ctx.destination);
      noise.start(now);
    }

    // Sparkler Crackles
    playCrackleSequence() {
      if (!this.enabled || !this.ctx) return;
      const pops = 8 + Math.floor(Math.random() * 10);
      for (let i = 0; i < pops; i++) {
        setTimeout(() => {
          if (!this.ctx || !this.enabled) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(2000 + Math.random() * 2600, now);

          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.035);
        }, Math.random() * 320);
      }
    }
  }

  const sound = new SoundSynthesizer();

  const soundPill = document.getElementById('soundPill');
  const soundIcon = document.getElementById('soundIcon');
  const soundTxt = document.getElementById('soundTxt');

  soundPill.addEventListener('click', () => {
    sound.init();
    const active = sound.toggle();
    soundIcon.textContent = active ? '🔊' : '🔇';
    soundTxt.textContent = active ? 'SOUND ON' : 'SOUND OFF';
  });


  /* ==========================================================================
     2. MASTER CANVAS SETUP & STARFIELD
     ========================================================================== */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Scintillating realistic stars
  class NightSky {
    constructor() {
      this.stars = [];
      this.init();
    }
    init() {
      this.stars = [];
      for (let i = 0; i < 260; i++) {
        this.stars.push({
          x: Math.random() * W,
          y: Math.random() * H * 0.82,
          r: Math.random() * 1.3 + 0.3,
          baseAlpha: Math.random() * 0.65 + 0.2,
          speed: Math.random() * 2.5 + 1.0,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
    draw(t) {
      for (let i = 0; i < this.stars.length; i++) {
        const s = this.stars[i];
        const alpha = s.baseAlpha * (0.6 + 0.4 * Math.sin(t * s.speed + s.phase));
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  const sky = new NightSky();


  /* ==========================================================================
     3. PHOTOREALISTIC TRADITIONAL CLAY DIYAS WITH FLICKERING FLAMES
     ========================================================================== */
  class PhotorealisticDiya {
    constructor(x, y, scale = 1.0) {
      this.x = x;
      this.y = y;
      this.scale = scale;
      this.flicker = Math.random() * 100;
    }

    draw(time) {
      this.flicker += 0.09;
      const s = this.scale;
      const x = this.x;
      const y = this.y;

      // Realistic flame micro-turbulent physics
      const turbulence = Math.sin(this.flicker * 3.4) * Math.cos(this.flicker * 2.1);
      const flameH = (34 + turbulence * 4.5) * s;
      const flameW = (13 + Math.sin(this.flicker * 4.8) * 2.5) * s;
      const tilt = Math.sin(this.flicker * 2.6) * 2.8 * s;

      // 1. Ambient Warm Ground Reflection
      const groundGlow = ctx.createRadialGradient(x, y + 10 * s, 4 * s, x, y + 10 * s, 115 * s);
      groundGlow.addColorStop(0, 'rgba(255, 140, 20, 0.42)');
      groundGlow.addColorStop(0.5, 'rgba(255, 80, 0, 0.16)');
      groundGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = groundGlow;
      ctx.beginPath();
      ctx.ellipse(x, y + 10 * s, 115 * s, 32 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      // 2. Atmospheric Flame Halo
      const halo = ctx.createRadialGradient(x + tilt, y - 18 * s, 2 * s, x + tilt, y - 18 * s, 80 * s);
      halo.addColorStop(0, 'rgba(255, 230, 140, 0.55)');
      halo.addColorStop(0.35, 'rgba(255, 150, 20, 0.25)');
      halo.addColorStop(0.7, 'rgba(255, 70, 0, 0.07)');
      halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(x + tilt, y - 18 * s, 80 * s, 0, Math.PI * 2);
      ctx.fill();

      // 3. Cast Shadow beneath Diya
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.beginPath();
      ctx.ellipse(x, y + 15 * s, 29 * s, 6 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      // 4. Clay Teracotta Body
      const clayGrad = ctx.createLinearGradient(x - 32 * s, y, x + 32 * s, y + 16 * s);
      clayGrad.addColorStop(0, '#531b05');
      clayGrad.addColorStop(0.25, '#99370b');
      clayGrad.addColorStop(0.5, '#ce5418');
      clayGrad.addColorStop(0.75, '#99370b');
      clayGrad.addColorStop(1, '#3c1202');

      ctx.beginPath();
      ctx.moveTo(x - 32 * s, y);
      ctx.bezierCurveTo(x - 30 * s, y + 16 * s, x + 30 * s, y + 16 * s, x + 32 * s, y);
      ctx.bezierCurveTo(x + 22 * s, y - 2 * s, x - 22 * s, y - 2 * s, x - 32 * s, y);
      ctx.fillStyle = clayGrad;
      ctx.fill();

      // Rim gold highlight
      ctx.strokeStyle = 'rgba(255, 190, 110, 0.55)';
      ctx.lineWidth = 1.5 * s;
      ctx.stroke();

      // 5. Ghee / Oil Pool
      const oilGrad = ctx.createRadialGradient(x, y - 1 * s, 2 * s, x, y - 1 * s, 24 * s);
      oilGrad.addColorStop(0, '#ffc759');
      oilGrad.addColorStop(0.6, '#b86600');
      oilGrad.addColorStop(1, '#482000');
      ctx.beginPath();
      ctx.ellipse(x, y, 24 * s, 5.5 * s, 0, 0, Math.PI * 2);
      ctx.fillStyle = oilGrad;
      ctx.fill();

      // Cotton Wick
      ctx.strokeStyle = '#151515';
      ctx.lineWidth = 2 * s;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + tilt * 0.35, y - 7 * s);
      ctx.stroke();

      // 6. Realistic 3-Layer Teardrop Flame (Lighter Blend)
      ctx.globalCompositeOperation = 'lighter';

      // Outer Orange Glow
      ctx.beginPath();
      ctx.moveTo(x - flameW, y - 6 * s);
      ctx.quadraticCurveTo(x - flameW * 1.1, y - flameH * 0.55, x + tilt, y - flameH - 6 * s);
      ctx.quadraticCurveTo(x + flameW * 1.1, y - flameH * 0.55, x + flameW, y - 6 * s);
      ctx.closePath();
      const outerGrad = ctx.createLinearGradient(x, y - 6 * s, x, y - flameH - 6 * s);
      outerGrad.addColorStop(0, 'rgba(255, 60, 0, 0.9)');
      outerGrad.addColorStop(0.5, 'rgba(255, 140, 0, 0.85)');
      outerGrad.addColorStop(0.9, 'rgba(255, 210, 0, 0.7)');
      outerGrad.addColorStop(1, 'rgba(255, 240, 150, 0)');
      ctx.fillStyle = outerGrad;
      ctx.fill();

      // Core Golden Flame
      ctx.beginPath();
      ctx.moveTo(x - flameW * 0.55, y - 6 * s);
      ctx.quadraticCurveTo(x - flameW * 0.6, y - flameH * 0.6, x + tilt * 0.7, y - flameH * 0.85 - 6 * s);
      ctx.quadraticCurveTo(x + flameW * 0.6, y - flameH * 0.6, x + flameW * 0.55, y - 6 * s);
      ctx.closePath();
      const coreGrad = ctx.createLinearGradient(x, y - 6 * s, x, y - flameH * 0.85 - 6 * s);
      coreGrad.addColorStop(0, '#ff9900');
      coreGrad.addColorStop(0.6, '#ffe600');
      coreGrad.addColorStop(1, '#ffffff');
      ctx.fillStyle = coreGrad;
      ctx.fill();

      // White-hot center
      ctx.beginPath();
      ctx.moveTo(x - flameW * 0.25, y - 6 * s);
      ctx.quadraticCurveTo(x - flameW * 0.28, y - flameH * 0.4, x + tilt * 0.4, y - flameH * 0.5 - 6 * s);
      ctx.quadraticCurveTo(x + flameW * 0.28, y - flameH * 0.4, x + flameW * 0.25, y - 6 * s);
      ctx.closePath();
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Blue base
      ctx.beginPath();
      ctx.arc(x, y - 5.5 * s, 3.5 * s, 0, Math.PI);
      ctx.fillStyle = 'rgba(40, 110, 255, 0.75)';
      ctx.fill();

      ctx.restore();
    }
  }

  let diyas = [];

  /* ==========================================================================
     4. PARTICLES, SMOKE & THRUSTER EXHAUST
     ========================================================================== */
  let sparks = [];
  let smokePuffs = [];

  function addSpark(x, y, vx, vy, color, size, decay, drag = 0.98, gravity = 0.05) {
    sparks.push({
      x, y, vx, vy, color, size,
      alpha: 1.0,
      decay: decay || (0.015 + Math.random() * 0.02),
      drag, gravity
    });
  }

  function addSmoke(x, y, vx, vy, size) {
    smokePuffs.push({
      x, y, vx, vy, size,
      maxSize: size * (2.4 + Math.random() * 1.6),
      alpha: 0.35 + Math.random() * 0.2,

      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.02
    });
  }


  /* ==========================================================================
     5. ULTRA-REALISTIC ROCKET WITH THRUST EXHAUST & ACCELERATION
     ========================================================================== */
  class HeavyRocket {
    constructor(startX, startY, targetX, targetY, onDetonate) {
      this.x = startX;
      this.y = startY;
      this.targetX = targetX;
      this.targetY = targetY;
      this.onDetonate = onDetonate;

      this.vx = (targetX - startX) * 0.014;
      this.vy = -16;
      this.thrust = 0.34;
      this.dead = false;
      this.trail = [];
      this.wobble = Math.random() * Math.PI * 2;
    }

    update() {
      if (this.dead) return;

      this.wobble += 0.25;
      this.vy -= this.thrust;
      this.x += this.vx + Math.sin(this.wobble) * 0.4;
      this.y += this.vy;

      // Exhaust spark shower
      for (let i = 0; i < 4; i++) {
        const spread = (Math.random() - 0.5) * 3;
        const sparkVy = -this.vy * 0.35 + Math.random() * 6 + 2;
        const colors = ['#ffffff', '#fff3a8', '#ffaa00', '#ff4400'];
        const col = colors[Math.floor(Math.random() * colors.length)];
        addSpark(this.x + spread, this.y + 16, (Math.random() - 0.5) * 2.5, sparkVy, col, Math.random() * 2.5 + 1.2, 0.045, 0.94, 0.1);
      }

      // Exhaust smoke puff
      if (Math.random() < 0.6) {
        addSmoke(this.x + (Math.random() - 0.5) * 4, this.y + 20, (Math.random() - 0.5) * 0.8, Math.random() * 1.2 + 0.5, 6 + Math.random() * 4);
      }

      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 20) this.trail.shift();

      if (this.y <= this.targetY || this.vy > -1.5) {
        this.dead = true;
        this.onDetonate(this.x, this.y);
      }
    }

    draw() {
      if (this.dead) return;

      // Glowing trail
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 180, 50, 0.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < this.trail.length; i++) {
        const p = this.trail[i];
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();

      // Rocket Missile Body
      ctx.translate(this.x, this.y);
      const angle = Math.atan2(this.vy, this.vx) + Math.PI / 2;
      ctx.rotate(angle);

      // Red nosecone
      ctx.fillStyle = '#ff2222';
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(-5, -6);
      ctx.lineTo(5, -6);
      ctx.closePath();
      ctx.fill();

      // Gold festive fuselage
      const fuseGrad = ctx.createLinearGradient(-5, -6, 5, 14);
      fuseGrad.addColorStop(0, '#ffd700');
      fuseGrad.addColorStop(0.5, '#ff8c00');
      fuseGrad.addColorStop(1, '#994400');
      ctx.fillStyle = fuseGrad;
      ctx.fillRect(-5, -6, 10, 20);

      // Stabilizer fins
      ctx.fillStyle = '#cc1100';
      ctx.beginPath();
      ctx.moveTo(-5, 8);
      ctx.lineTo(-12, 16);
      ctx.lineTo(-5, 14);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(5, 8);
      ctx.lineTo(12, 16);
      ctx.lineTo(5, 14);
      ctx.closePath();
      ctx.fill();

      // White-hot exhaust nozzle
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(0, 14, 4, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }


  /* ==========================================================================
     6. THE SPARKLER TEXT PARTICLES ENGINE (Matches Reference Image 3 Exactly!)
     Renders "HAPPY DIWALI" + User's Name out of thousands of sparkling embers!
     ========================================================================== */
  class SparklerGlitterParticle {
    constructor(originX, originY, targetX, targetY, colorPalette, delay) {
      this.originX = originX;
      this.originY = originY;
      this.targetX = targetX;
      this.targetY = targetY;
      this.colorPalette = colorPalette;
      this.color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
      this.delay = delay;

      this.x = originX;
      this.y = originY;
      this.t = 0;
      this.arrived = false;

      this.jitterX = 0;
      this.jitterY = 0;
      this.twinkleRate = Math.random() * 0.35 + 0.15;
      this.twinklePhase = Math.random() * Math.PI * 2;
      this.size = Math.random() * 2.2 + 1.2;
    }

    update() {
      if (this.delay > 0) {
        this.delay--;
        return;
      }

      if (!this.arrived) {
        this.t += 0.045;
        const ease = 1 - Math.pow(1 - Math.min(this.t, 1), 3);
        this.x = this.originX + (this.targetX - this.originX) * ease;
        this.y = this.originY + (this.targetY - this.originY) * ease;
        if (this.t >= 1) this.arrived = true;
      } else {
        // Continuous burning sparkler jitter
        this.twinklePhase += this.twinkleRate;
        this.jitterX = (Math.random() - 0.5) * 1.8;
        this.jitterY = (Math.random() - 0.5) * 1.8;

        // Burning metal ember dropping
        if (Math.random() < 0.009) {
          addSpark(
            this.targetX + this.jitterX,
            this.targetY + this.jitterY,
            (Math.random() - 0.5) * 1.5,
            Math.random() * 2.2 + 0.6,
            this.color,
            1.2,
            0.03,
            0.96,
            0.08
          );
        }
      }
    }

    draw() {
      if (this.delay > 0) return;

      const px = this.x + this.jitterX;
      const py = this.y + this.jitterY;

      // Scintillation shine factor
      const shine = 0.5 + 0.5 * Math.sin(this.twinklePhase);
      const alpha = (0.6 + 0.4 * shine).toFixed(2);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter'; // Additive blending for white-hot glitter overlap

      ctx.fillStyle = this.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(px, py, this.size * (0.8 + 0.5 * shine), 0, Math.PI * 2);
      ctx.fill();

      // Diamond sparkle glint
      if (shine > 0.72) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.8;
        ctx.globalAlpha = (shine - 0.72) * 2.8;
        const spike = this.size * 3.4;
        ctx.beginPath();
        ctx.moveTo(px - spike, py);
        ctx.lineTo(px + spike, py);
        ctx.moveTo(px, py - spike);
        ctx.lineTo(px, py + spike);
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  // Sparkling Palette sets
  const TEXT_PALETTES = [
    // Royal Gold & Diamond White
    ['#ffffff', '#fff7cc', '#ffe57f', '#ffd700', '#ffaa00', '#ff7700'],
    // Saffron & Crimson Fire
    ['#ffffff', '#ffeedd', '#ff9955', '#ff5522', '#ff1144', '#ffd700'],
    // Peacock Emerald & Cyan Spark
    ['#ffffff', '#ccffff', '#00ffcc', '#00ddaa', '#ffd700', '#66ff66'],
    // Tricolor Firework Sparkler (Blue, White, Amber - like Image 3)
    ['#44aaff', '#88ccff', '#ffffff', '#ffdd88', '#ff5566', '#ff2244']
  ];

  let sparklerParticles = [];

  function generateSparklerText(name, burstX, burstY) {
    sparklerParticles = [];
    const offscreen = document.createElement('canvas');
    const offCtx = offscreen.getContext('2d');

    const canvasW = Math.min(W * 0.95, 1200);
    const canvasH = Math.min(H * 0.52, 520);
    offscreen.width = canvasW;
    offscreen.height = canvasH;

    offCtx.fillStyle = '#000000';
    offCtx.fillRect(0, 0, canvasW, canvasH);

    const isMobile = W < 600;
    const line1Size = isMobile ? Math.floor(W * 0.088) : Math.floor(Math.min(W * 0.065, 66));
    const line2Size = isMobile ? Math.floor(W * 0.11) : Math.floor(Math.min(W * 0.082, 88));

    const line1Pal = TEXT_PALETTES[0]; // Gold/White for Happy Diwali
    const line2Pal = TEXT_PALETTES[Math.floor(Math.random() * TEXT_PALETTES.length)]; // Dynamic for name

    // Line 1: ✨ HAPPY DIWALI ✨
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';
    offCtx.font = `900 ${line1Size}px 'Cinzel', serif`;
    offCtx.fillStyle = '#ffffff';
    const line1Y = canvasH * 0.32;
    offCtx.fillText('✨ HAPPY DIWALI ✨', canvasW / 2, line1Y);

    // Line 2: USER'S NAME
    offCtx.font = `900 ${line2Size}px 'Cinzel', 'Playfair Display', serif`;
    const line2Y = canvasH * 0.72;
    offCtx.fillText(name.toUpperCase(), canvasW / 2, line2Y);

    // Raster scan text pixels
    const imgData = offCtx.getImageData(0, 0, canvasW, canvasH);
    const data = imgData.data;

    const screenOffsetX = (W - canvasW) / 2;
    const screenOffsetY = Math.max(H * 0.12, (H * 0.42) - (canvasH / 2));
    const step = isMobile ? 5 : 4;

    for (let y = 0; y < canvasH; y += step) {
      for (let x = 0; x < canvasW; x += step) {
        const idx = (y * canvasW + x) * 4;
        if (data[idx] > 140) { // Text pixel found
          const targetX = screenOffsetX + x + (Math.random() - 0.5) * 2;
          const targetY = screenOffsetY + y + (Math.random() - 0.5) * 2;

          const angle = Math.atan2(targetY - burstY, targetX - burstX) + (Math.random() - 0.5) * 0.3;
          const dist = Math.hypot(targetX - burstX, targetY - burstY);
          const startX = burstX + Math.cos(angle) * (dist * 0.15);
          const startY = burstY + Math.sin(angle) * (dist * 0.15);

          const delay = Math.floor(Math.random() * 14);
          const chosenPal = (y < canvasH * 0.5) ? line1Pal : line2Pal;

          sparklerParticles.push(new SparklerGlitterParticle(
            startX, startY, targetX, targetY, chosenPal, delay
          ));
        }
      }
    }
  }


  /* ==========================================================================
     7. ULTRA-REALISTIC FIREWORK BURSTS & SOUND ORCHESTRATION
     ========================================================================== */
  class FireworkBurstParticle {
    constructor(x, y, vx, vy, color, type = 'chrysanthemum') {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.color = color;
      this.type = type;
      this.alpha = 1.0;
      this.trail = [];
      this.decay = (type === 'willow') ? (0.007 + Math.random() * 0.006) : (0.014 + Math.random() * 0.012);
      this.gravity = (type === 'willow') ? 0.09 : 0.065;
      this.drag = (type === 'willow') ? 0.965 : 0.955;
      this.size = Math.random() * 2.2 + 1.2;
      this.strobe = (type === 'strobe');
      this.strobePhase = Math.random() * 10;
    }

    update() {
      this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
      if (this.trail.length > (this.type === 'willow' ? 14 : 7)) {
        this.trail.shift();
      }

      this.vx *= this.drag;
      this.vy *= this.drag;
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.alpha -= this.decay;

      if (this.type === 'willow' && Math.random() < 0.003) {
        sound.playCrackleSequence();
      }
    }

    draw() {
      if (this.alpha <= 0) return;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      // Weeping willow trail
      ctx.lineWidth = this.size;
      for (let i = 0; i < this.trail.length - 1; i++) {
        const p1 = this.trail[i];
        const p2 = this.trail[i + 1];
        const segAlpha = (p1.alpha * (i / this.trail.length)).toFixed(2);
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = segAlpha;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      let drawAlpha = this.alpha;
      if (this.strobe) {
        this.strobePhase += 0.4;
        drawAlpha = Math.sin(this.strobePhase) > 0 ? this.alpha : 0.05;
      }

      ctx.globalAlpha = Math.max(0, drawAlpha);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // Blinding Shockwave Ring
  class Shockwave {
    constructor(x, y, maxRadius, color) {
      this.x = x;
      this.y = y;
      this.r = 2;
      this.maxR = maxRadius;
      this.color = color || 'rgba(255, 230, 180, 0.8)';
      this.alpha = 1.0;
    }
    update() {
      this.r += (this.maxR - this.r) * 0.18 + 2;
      this.alpha -= 0.038;
    }
    draw() {
      if (this.alpha <= 0) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = this.color;
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  let bursts = [];
  let shockwaves = [];
  let screenFlash = 0;

  function createRealisticExplosion(x, y, palette, count = 160, type = 'chrysanthemum') {
    sound.playExplosion(1.0);
    sound.playCrackleSequence();

    screenFlash = 0.55;
    shockwaves.push(new Shockwave(x, y, Math.min(W, H) * 0.35));

    const colors = palette || ['#ffd700', '#ff9900', '#ffffff', '#ff3300', '#00eeff'];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (Math.random() * 0.85 + 0.15) * (type === 'willow' ? 14 : 16);
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      const col = colors[Math.floor(Math.random() * colors.length)];
      bursts.push(new FireworkBurstParticle(x, y, vx, vy, col, type));
    }

    for (let i = 0; i < 8; i++) {
      addSmoke(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 1.5, 14 + Math.random() * 12);
    }
  }


  /* ==========================================================================
     8. CELEBRATION CONTROLLER
     ========================================================================== */
  let activeRockets = [];

  function startCelebration() {
    const name = nameField.value.trim();
    if (!name) {
      nameField.classList.remove('error-shake');
      void nameField.offsetWidth;
      nameField.classList.add('error-shake');

  /* ==========================================================================
     9. MASTER 60-120 FPS RENDERING LOOP
     ========================================================================== */
  function render(now) {
    // Night sky background with persistence trail
    ctx.fillStyle = 'rgba(2, 1, 6, 0.22)';
    ctx.fillRect(0, 0, W, H);

    // Blinding Screen Flash
    if (screenFlash > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255, 235, 200, ${screenFlash.toFixed(2)})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      screenFlash *= 0.86;
    }

    // 1. Stars
    sky.draw(now * 0.001);

    // 2. Shockwaves
    shockwaves = shockwaves.filter(sw => sw.alpha > 0.01);
    for (let i = 0; i < shockwaves.length; i++) {
      shockwaves[i].update();
      shockwaves[i].draw();
    }

    // 3. Smoke Puffs
    smokePuffs = smokePuffs.filter(s => s.alpha > 0.01);
    for (let i = 0; i < smokePuffs.length; i++) {
      const s = smokePuffs[i];
      s.x += s.vx;
      s.y += s.vy;
      s.size += (s.maxSize - s.size) * 0.04;
      s.alpha -= s.decay;
      s.rotation += s.rotSpeed;

      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rotation);
      ctx.fillStyle = `rgba(130, 110, 150, ${s.alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(0, 0, s.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 4. Active Rockets
    activeRockets = activeRockets.filter(r => !r.dead);
    for (let i = 0; i < activeRockets.length; i++) {
      activeRockets[i].update();
      activeRockets[i].draw();
    }

    // 5. Firework Bursts
    bursts = bursts.filter(b => b.alpha > 0.01);
    for (let i = 0; i < bursts.length; i++) {
      bursts[i].update();
      bursts[i].draw();
    }

    // 6. Sparks & Embers
    sparks = sparks.filter(sp => sp.alpha > 0.01);
    for (let i = 0; i < sparks.length; i++) {
      const sp = sparks[i];
      sp.vx *= sp.drag;
      sp.vy *= sp.drag;
      sp.vy += sp.gravity;
      sp.x += sp.vx;
      sp.y += sp.vy;
      sp.alpha -= sp.decay;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = sp.color;
      ctx.globalAlpha = Math.max(0, sp.alpha);
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 7. Sparkler Text Particles (Image 3 glitter effect)
    for (let i = 0; i < sparklerParticles.length; i++) {
      sparklerParticles[i].update();
      sparklerParticles[i].draw();
    }

    // 8. Traditional Realistic Diyas
    for (let i = 0; i < diyas.length; i++) {
      diyas[i].draw(now * 0.001);
    }

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

  </script>
</body>
</html>
